# qu-ng-l-key-3
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Quản Lý Key TikTok Xu</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #00f2fe;
      --danger: #ff4d4d;
      --success: #2ed573;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text); padding: 15px; }
    .container { max-width: 700px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: var(--primary); font-size: 1.5rem; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 1rem; outline: none; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .btn-create { background: var(--primary); color: #000; }
    .btn-create:active { opacity: 0.8; }
    
    .key-list { display: flex; flex-direction: column; gap: 12px; }
    .key-item { background: #2a2a2a; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 8px; position: relative; border-left: 4px solid var(--primary); }
    .key-header { display: flex; justify-content: space-between; align-items: center; }
    .key-code { font-size: 1.1rem; font-weight: bold; color: var(--primary); letter-spacing: 1px; }
    .key-status { font-size: 0.8rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .status-active { background: rgba(46, 213, 115, 0.2); color: var(--success); }
    .status-expired { background: rgba(255, 77, 77, 0.2); color: var(--danger); }
    .key-info { font-size: 0.85rem; color: #aaa; }
    .key-actions { display: flex; gap: 10px; margin-top: 5px; }
    .btn-sm { flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
    .btn-copy { background: #333; color: #fff; }
    .btn-delete { background: var(--danger); color: #fff; }

    @media (min-width: 600px) {
      .key-item { flex-direction: row; align-items: center; justify-content: space-between; }
      .key-actions { margin-top: 0; width: auto; }
      .btn-sm { flex: initial; padding: 8px 15px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>QUẢN LÝ KEY TIKTOK XU</h1>
      <p style="font-size: 0.85rem; color: #888;">Trang Dành Cho Chủ Shop</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="key-days">Thời hạn cấp Key (Số ngày):</label>
        <input type="number" id="key-days" value="30" min="1">
      </div>
      <button class="btn btn-create" onclick="generateKey()">+ TẠO KEY MỚI</button>
    </div>

    <h2 style="font-size: 1.1rem; margin-bottom: 12px; color: #ddd;">Danh Sách Key Khách Hàng</h2>
    <div class="key-list" id="key-list"></div>
  </div>

  <script>
    function getKeys() {
      return JSON.parse(localStorage.getItem('tiktok_keys') || '{}');
    }

    function saveKeys(keys) {
      localStorage.setItem('tiktok_keys', JSON.stringify(keys));
    }

    function generateKey() {
      const days = parseInt(document.getElementById('key-days').value) || 30;
      const randomKey = 'TTXU-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      
      const expireDate = new Date();
      expireDate.setDate(expireDate.getDate() + days);

      const keys = getKeys();
      keys[randomKey] = expireDate.toISOString();
      saveKeys(keys);

      renderKeys();
    }

    function copyKey(key) {
      navigator.clipboard.writeText(key).then(() => {
        alert('Đã copy Key: ' + key);
      });
    }

    function deleteKey(key) {
      if (confirm('Bạn có chắc chắn muốn xóa Key: ' + key + '?')) {
        const keys = getKeys();
        delete keys[key];
        saveKeys(keys);
        renderKeys();
      }
    }

    function renderKeys() {
      const keys = getKeys();
      const container = document.getElementById('key-list');
      container.innerHTML = '';

      const now = new Date();
      const keyArray = Object.keys(keys);

      if (keyArray.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">Chưa có Key nào được tạo</div>';
        return;
      }

      keyArray.reverse().forEach(key => {
        const expireDate = new Date(keys[key]);
        const isExpired = expireDate < now;

        const item = document.createElement('div');
        item.className = 'key-item';
        item.style.borderLeftColor = isExpired ? 'var(--danger)' : 'var(--primary)';

        item.innerHTML = `
          <div>
            <div class="key-header">
              <span class="key-code">${key}</span>
              <span class="key-status ${isExpired ? 'status-expired' : 'status-active'}">
                ${isExpired ? 'Hết hạn' : 'Đang dùng'}
              </span>
            </div>
            <div class="key-info" style="margin-top: 5px;">Hạn dùng: ${expireDate.toLocaleDateString('vi-VN')} - ${expireDate.toLocaleTimeString('vi-VN')}</div>
          </div>
          <div class="key-actions">
            <button class="btn-sm btn-copy" onclick="copyKey('${key}')">Copy Key</button>
            <button class="btn-sm btn-delete" onclick="deleteKey('${key}')">Xóa</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    renderKeys();
  </script>
</body>
</html>
